<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New post from {{ host_name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
         style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- Post card -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0"
               style="width:100%;max-width:625px;background-color:#ffffff;">

          <!-- Author row -->
          <tr>
            <td style="padding:20px 20px 10px 20px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="40" valign="top">
                    <!-- Profile pic (when set) -->
                    <img src="{{ profile_pic_src }}" alt="Profile pic"
                         style="display:{{ profile_pic_img_display }};width:40px;height:40px;border-radius:50%;object-fit:cover;">
                    <!-- Circular avatar initial (fallback) -->
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                           style="display:{{ profile_pic_initial_display }};">
                      <tr>
                        <td style="width:40px;height:40px;border-radius:50%;background-color:{{ brand_color }};text-align:center;vertical-align:middle;">
                          <span style="display:block;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;line-height:40px;">{{ host_initial }}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td style="padding-left:10px;" valign="top">
                    <p style="margin:0 0 2px 0;">
                      <a href="mailto:{{ host_email }}"
                         style="color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;text-decoration:none;">{{ host_name }}</a>
                    </p>
                    <p style="margin:0;color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.4;">{{ host_email_display }}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Post body -->
          <tr>
            <td style="padding:0 20px 6px 70px;">
              <p style="margin:0;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:400;line-height:1.6;">{{ post_body }}</p>
            </td>
          </tr>

          <!-- Post photo (present only for photo posts) -->
          <tr style="display:{{ post_photo_display }};">
            <td style="padding:0 20px 6px 70px;">
              <img src="{{ post_photo_src }}" alt="Photo"
                   style="display:block;max-width:100%;height:auto;border-radius:6px;">
            </td>
          </tr>

          <!-- Date row -->
          <tr>
            <td style="padding:0 20px 14px 70px;">
              <p style="margin:0;color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.4;">{{ created_at }}</p>
            </td>
          </tr>

          <!-- Action row -->
          <tr>
            <td style="padding:0 20px 20px 70px;">
              <a href="{{ like_href }}"
                 style="color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;text-decoration:none;">Like</a>
              <span style="color:#d1d5db;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;">&nbsp;&middot;&nbsp;</span>
              <a href="{{ comment_href }}"
                 style="color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;text-decoration:none;">Reply</a>
            </td>
          </tr>

          <!-- Likes row (injected HTML or empty) -->
          {{ likes_row }}

          <!-- Comment divider -->
          <tr style="display:{{ comment_section_display }};">
            <td style="border-top:1px solid #f3f4f6;padding-top:0;"></td>
          </tr>

          <!-- Comment author row -->
          <tr style="display:{{ comment_section_display }};">
            <td style="padding:14px 20px 0 70px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="28" valign="top">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td style="width:28px;height:28px;border-radius:50%;background-color:#3b82f6;text-align:center;vertical-align:middle;">
                          <span style="display:block;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;line-height:28px;">{{ sender_initial }}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td style="padding-left:8px;" valign="top">
                    <p style="margin:0 0 1px 0;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;">{{ sender_name }}</p>
                    <p style="margin:0;color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.4;">{{ comment_created_at }}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Comment body -->
          <tr style="display:{{ comment_section_display }};">
            <td style="padding:6px 20px 6px 106px;">
              <p style="margin:0;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;">{{ comment_body }}</p>
            </td>
          </tr>

          <!-- Comment action row -->
          <tr style="display:{{ comment_section_display }};">
            <td style="padding:0 20px 20px 106px;">
              <a href="{{ comment_like_href }}"
                 style="color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;text-decoration:none;">Like</a>
            </td>
          </tr>

        </table>

        <!-- Footer -->
        <p style="margin:16px 0 0 0;text-align:center;color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.5;">{{ signature }}</p>

      </td>
    </tr>
  </table>

</body>
</html>
